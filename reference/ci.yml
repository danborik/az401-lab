# Reference answer for lab 3.1 (GitHub Actions). Write your own with Copilot first, then compare.
# To use it: copy to .github/workflows/ci.yml
name: ci
on:
  push: { branches: [ main ] }
  pull_request: { branches: [ main ] }

permissions: { contents: read }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with: { dotnet-version: '10.0.x' }
    - run: dotnet test --configuration Release --collect "XPlat Code Coverage" --logger trx
    - run: dotnet publish src/Api -c Release -o out
    - uses: actions/upload-artifact@v4
      with: { name: drop, path: out, retention-days: 7 }
